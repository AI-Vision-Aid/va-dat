name: Publish Image

# Builds the application image and pushes it to GHCR so Coolify pulls a
# finished image instead of building on the deployment host, then triggers the
# deployment once the push has completed.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be lowercase — GHCR rejects mixed-case image names, and the org is "C4G".
  IMAGE_BASE: ghcr.io/c4g/va-dat

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy only what has been shown to start and serve. CI runs on pull
      # requests, so a merge commit itself is never exercised before this point.
      # No API key is supplied, so the audit runs in dry-run mode and bills
      # nothing.
      - name: Smoke test the published image
        run: |
          docker run -d --name va-dat-smoke -p 8000:8000 \
            --tmpfs /tmp:size=512m --read-only "${IMAGE_BASE}:${GITHUB_SHA}"

          healthy=
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' va-dat-smoke)
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then healthy=1; break; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            echo "::error::published image never became healthy"
            docker logs va-dat-smoke
            exit 1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)
          [ "$code" = "200" ] || { echo "::error::GET / returned $code"; exit 1; }

          curl -s -X POST http://localhost:8000/api/audit \
            -H 'Content-Type: application/json' \
            -d '{"html_content":"<html><head><title>smoke</title></head><body><img src=x></body></html>"}' \
            -o body.ndjson

          python3 - <<'PY'
          import json, pathlib, sys
          lines = [json.loads(l) for l in
                   pathlib.Path("body.ndjson").read_text().splitlines() if l.strip()]
          results = [l for l in lines if l.get("type") == "result"]
          if len(results) != 1 or not results[0].get("success"):
              print("::error::published image did not return a successful audit")
              sys.exit(1)
          if not results[0]["summary"]["dry_run"]:
              print("::error::image ran with an API key — it must not carry credentials")
              sys.exit(1)
          print(f"OK — {len(results[0]['programmatic_findings'])} findings")
          PY

      - name: Stop smoke test container
        if: always()
        run: docker rm -f va-dat-smoke || true

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ''
            echo '```'
            echo "${IMAGE_BASE}:latest"
            echo "${IMAGE_BASE}:${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deploying from here (rather than letting Coolify redeploy on git push)
      # avoids a race where Coolify pulls `:latest` before this workflow has
      # finished pushing it. Skipped automatically until the secret exists.
      # The secret is surfaced through `env` because the `secrets` context is
      # not available in a step-level `if:`.
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          curl -fsS -X GET \
            "https://coolify.c4g.dev/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
