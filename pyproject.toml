[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionaid"
version = "0.1.0"
description = "LLM vision aid auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic~=0.84.0",
    "beautifulsoup4>=4.9.2",
    "cryptography>=45.0.0",
    "lxml>=4.9.0",
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-storage>=3.3.0",
    "google-cloud-tasks>=2.19.0",
    "python-dotenv~=1.2.1",
    "requests>=2.32.2",
    "curl-cffi>=0.14.0",
    "playwright>=1.55.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[tool.setuptools]
packages = ["vision_aid"]
